<script type="text/x-dc" data-dc-script data-props="{&quot;entry&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;notice&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;진입&quot;},&quot;startPeriod&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;week&quot;,&quot;month&quot;,&quot;all&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;진입&quot;},&quot;demoState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;todayEmpty&quot;,&quot;empty&quot;,&quot;loading&quot;,&quot;offline&quot;,&quot;seed&quot;,&quot;overCap&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;W-01 상태&quot;},&quot;chatbotUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;챗봇&quot;}}">
class Component extends DCLogic {
  state = { db: window.SPACELOG ? window.SPACELOG.initial() : null, period: 'today', custom: { from: '', to: '' }, focus: null, panel: null, detail: null, cart: [], drawer: false, notice: false, toast: '', toastOn: false, tour: 0, dragging: false, added: null, addOpen: false, note: '', narrow: window.innerWidth < 760 };
  fileRef = React.createRef();
  noteRef = React.createRef();
  saveNote() {
    const S = window.SPACELOG, txt = this.state.note.trim(); if (!S || !txt) return;
    const it = S.fromText(txt); if (it[0] && it[0].kind === 'text') it[0].memo = txt;
    this.setState({ addOpen: false, note: '' }); this.addItems(it);
  }
  // 체험 8단계: 관측소에서 눌러 볼 보기 방식과 지금까지 눌러 본 것
  obs8() { const s = this.state, db = s.db; if (s.tour !== 8 || !db) return null;
    const L = db.links || [], lk = L.find(l => l.id === s.obsLink) || L.find(l => window.SPACELOG.isTourLink(l)) || L[L.length - 1]; if (!lk) return null;
    const ms = lk.ids.map(id => db.stars.find(x => x.id === id)).filter(Boolean);
    const modes = (ms.some(x => x.csv && x.csv.rows && x.csv.rows.length) ? [['dash', '시각화 대시보드'], ['table', '표 · CSV']] : []).concat([['photos', '사진 모아보기'], ['texts', '텍스트 모아보기']]);
    const m0 = (lk.viz || {}).mode, cur = modes.some(m => m[0] === m0) ? m0 : modes[0][0], seen = modes.map(m => m[0]).filter(k => k === cur || (s.tourModes || []).includes(k));

          else if (!this._d8) { const rest = o.modes.map(m => m[0]).filter(k => !o.seen.includes(k));
            const step = i => { const lk = ((this.state.db || {}).links || []).find(l => l.id === o.lk.id); if (i >= rest.length || !lk || this.state.tour !== 8) { this._d8 = null; return; }
              this._act({ type: 'linkViz', id: lk.id, viz: { ...(lk.viz || {}), mode: rest[i] } }); this._d8 = setTimeout(() => step(i + 1), 1200); };
            step(0); } }
        else if (t === 9) this.go(10, 'SPACELOG_Collector.dc.html');
        else if (t === 11) { this.setState({ drawer: true, cart: [], panel: null, detail: null, focus: null, notice: false }); this.setTour(12); }
        else if (t === 12) this.go(1, 'SPACELOG_Collector.dc.html');
        else this.go(t, 'SPACELOG_Collector.dc.html');
      },
      wide: !s.narrow, inset: s.narrow ? '8px' : '16px', panelLeft: s.narrow ? '8px' : 'auto', panelTop: s.narrow ? '40%' : '92px', shipTop: s.narrow ? '14%' : '16px', panelW: s.narrow ? 'auto' : '440px', shipW: s.narrow ? 'auto' : '460px', tourLabelDisplay: s.narrow ? 'none' : 'flex',
      showAdd: !s.panel && !s.drawer && !s.focus && !s.added && !s.dragging && !s.toastOn && !s.addOpen, fileRef: this.fileRef, noteRef: this.noteRef,
      addOpen: s.addOpen && !s.dragging, note: s.note, noteEmpty: !s.note.trim(), noteBtnOpacity: s.note.trim() ? 1 : 0.4,
      noteHint: s.panel && s.db && s.db.planets.find(x => x.id === s.panel) ? s.db.planets.find(x => x.id === s.panel).name + ' 행성에 넣어요' : 'Enter로 넣기 · Shift+Enter 줄바꿈',
      openAdd: () => { if (!this.ok()) return; this.setState({ addOpen: true }, () => this.noteRef.current && this.noteRef.current.focus()); },
      closeAdd: () => this.setState({ addOpen: false }),
      onNote: e => this.setState({ note: e.target.value }),
      onNoteKey: e => { if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); this.saveNote(); } },
      saveNote: () => this.saveNote(),
      pickFiles: () => this.ok() && this.fileRef.current && this.fileRef.current.click(),
      onFiles: e => { const it = S.fromTransfer({ getData: () => '', files: e.target.files }); e.target.value = ''; this.setState({ addOpen: false }); this.addItems(it); },
      dragging: s.dragging, dropHint: s.panel && s.db && s.db.planets.find(x => x.id === s.panel) ? s.db.planets.find(x => x.id === s.panel).name + ' 행성에 넣어요' : '종류에 맞는 행성에 자동으로 넣어요',
      onDragEnter: e => { if (s.tour) return; e.preventDefault(); this._dc = (this._dc || 0) + 1; if (!s.dragging) this.setState({ dragging: true }); },
      onDragOver: e => { if (!s.tour) e.preventDefault(); },
      onDragLeave: () => { this._dc = Math.max(0, (this._dc || 0) - 1); if (!this._dc && s.dragging) this.setState({ dragging: false }); },
      onDrop: e => { e.preventDefault(); this._dc = 0; const it = S.fromTransfer(e.dataTransfer); this.setState({ dragging: false }); if (it.length) this.addItems(it); else this.flash('넣을 수 있는 내용이 없어요'); },
      hasAdded: !!s.added, addedText: s.added ? s.added.text : '', undoAdd: () => this.undoAdd(),
      toast: s.toast, toastOpacity: s.toastOn ? 1 : 0
    };
  }
}
</script>

# Render에 올리는 것은 "받는 곳" 한 페이지(spacelog-download)와, 사용법을 안내하는 챗봇(spacelog-chatbot)이다.
# 챗봇은 사용자의 기록을 받지 않는다 (질문 글만 처리하고 저장하지 않는다).
# 수집 앱과 로컬 웹은 사용자의 PC에서만 돈다 (POLICY 1-1·1-3).
# 기록·보관함·로컬 서버는 어디에도 올라가지 않는다.
services:
  - type: web
    name: spacelog-download
    runtime: static
    rootDir: site
    buildCommand: ""        # 빌드 도구 없음. 정적 파일 그대로 올린다
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  # 사용법 안내 챗봇 (chatbot/README.md). OPENAI_API_KEY 는 Render 대시보드에서 직접 넣는다
  - type: web
    name: spacelog-chatbot
    runtime: node
    rootDir: chatbot
    buildCommand: npm install
    startCommand: node server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENAI_API_KEY
        sync: false
      - key: CHATBOT_MODEL
        value: gpt-5-mini
      - key: CHATBOT_DAILY_MAX
        value: "1000"

    <button onClick="{{ tourNext }}" class="cc-type-caption" style="flex:none;height:44px;padding:0 20px;border:0;border-radius:9999px;background:var(--color-primary);color:#fff;cursor:pointer;transition:transform 200ms var(--ease-standard)" style-active="transform:scale(0.95)">{{ tourCta }}</button>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;collapsed&quot;,&quot;dragging&quot;,&quot;saving&quot;,&quot;confirm&quot;,&quot;settings&quot;,&quot;fail&quot;,&quot;notice&quot;],&quot;default&quot;:&quot;open&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;시작 화면&quot;},&quot;serverDown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;상태&quot;},&quot;frozen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;}}">
const SAMPLES = [
  { kind: 'image', title: '회의 캡처.png', meta: 'PNG · 1.8MB' },
  { kind: 'file', title: '요구사항 초안 v2.pdf', meta: 'PDF · 640KB' },
  { kind: 'link', title: '로컬 퍼스트 소프트웨어 글', meta: 'inkandswitch.com' },
  { kind: 'text', title: '탐사선 이름 아이디어', meta: '텍스트 · 64자' }
];
class Component extends DCLogic {
  state = { ...this.sceneState(this.props.scene || 'open'), tour: 0 };
  setTour(n) { if (window.SPACELOG_TOUR) window.SPACELOG_TOUR.set(n); if (!n && window.SPACELOG) window.SPACELOG.clearTourLink(); this.setState({ tour: n }); }
  go(n, url) { const T = window.SPACELOG_TOUR; if (T) { T.set(n); url = T.url(url); } window.location.href = url; }
  ok(...steps) { const t = this.state.tour; if (!t || steps.includes(t)) return true; this.flash('체험 중에는 안내된 단계만 할 수 있어요'); return false; }
  waitTour(def) { if (this.props.frozen) return; if (!window.SPACELOG_TOUR) { this._w = setTimeout(() => this.waitTour(def), 60); return; } const v = window.SPACELOG_TOUR.boot(); this.setState(v === 2 ? { tour: v, view: 'confirm', items: [SAMPLES[2]], collapsed: false } : { tour: v }); }
  sceneState(sc) {
    const b = { collapsed: false, view: 'drop', status: 'idle', items: [], ids: [], planet: 'p1', notice: false, seen: false, settings: (this.state && this.state.settings) || { shortcut: 'Ctrl+Shift+S', redisc: true, autostart: true }, toast: '', toastOn: false };
    if (sc === 'collapsed') b.collapsed = true;
    else if (sc === 'dragging' || sc === 'saving' || sc === 'fail') b.status = sc;
    else if (sc === 'confirm') { b.view = 'confirm'; b.items = [SAMPLES[0]]; }
    else if (sc === 'settings') b.view = 'settings';
    else if (sc === 'notice') { b.collapsed = true; b.notice = true; }
    return b;
  }
  componentDidMount() {
    this.waitTour(1);
    // 지난번에 넣은 기록을 다시 열었을 때도 보여 줍니다 (체험 중이 아닐 때만).
    this._k = setTimeout(() => { const s = this.state; if (this.props.frozen || (this.props.scene && this.props.scene !== 'open') || s.tour || s.view !== 'drop' || s.status !== 'idle' || s.items.length) return;
      try { const k = JSON.parse(localStorage.getItem('spacelog_collector_last_v1') || 'null'); if (k && k.items && k.items.length) this.setState({ view: 'confirm', items: k.items, ids: k.ids || [], planet: k.planet || 'p1', seen: true }); } catch (e) {} }, 500);
    this._key = e => {
      if (this.props.frozen || /INPUT|TEXTAREA/.test(e.target.tagName) || this.state.view === 'settings' || this.state.tour > 1) return;
      const S = window.SPACELOG; if (!S || S.combo(e) !== this.state.settings.shortcut) return;
      e.preventDefault();
      const fail = () => this.flash('클립보드를 읽을 수 없어요. 창을 누르고 붙여넣기를 써 주세요');
      try { navigator.clipboard.readText().then(t => { const it = S.fromText(t); it.length ? this.save(it) : this.flash('클립보드가 비어 있어요'); }).catch(fail); } catch (err) { fail(); }
    };
    window.addEventListener('keydown', this._key);
  }
  componentDidUpdate(prev) {
    if (prev.scene !== this.props.scene) this.setState(this.sceneState(this.props.scene || 'open'));
    if (this.state.tour === 1 && this.state.view === 'confirm') this.setTour(2);
  }
  componentWillUnmount() { clearTimeout(this._k); clearTimeout(this._r); window.removeEventListener('keydown', this._key); clearTimeout(this._a); clearTimeout(this._b); clearTimeout(this._t); clearTimeout(this._w); }
  keep(items, ids, planet) { try { if (items && items.length) localStorage.setItem('spacelog_collector_last_v1', JSON.stringify({ items, ids, planet })); else localStorage.removeItem('spacelog_collector_last_v1'); } catch (e) {} }
  flash(msg) { clearTimeout(this._t); this.setState({ toast: msg, toastOn: true }); this._t = setTimeout(() => this.setState({ toastOn: false }), 2600); }
  save(items) {
    const S = window.SPACELOG; if (!S || !items.length) return;
    if (items.some(i => i._file)) { S.thumbs(items).then(it => this.save(it)); return; }
    clearTimeout(this._a); clearTimeout(this._b);
    this.setState({ collapsed: false, view: 'drop', status: 'saving', seen: false });
    this._a = setTimeout(() => {
      if (this.props.serverDown) { this.setState({ status: 'fail' }); return; }
      const planet = S.assign(items[0].kind), ids = S.addInbox(items, planet);
      this.setState({ status: 'done', items, ids, planet }); this.keep(items, ids, planet);
      this._b = setTimeout(() => this.setState({ view: 'confirm', status: 'idle' }), 700);
    }, 900);
  }
  renderVals() {
    const S = window.SPACELOG, s = this.state;
    const db = S ? S.initial() : null;
    const re = db ? S.rediscovery(db) : null, rp = re ? db.planets.find(p => p.id === re.planet) : null;
    return {
      expanded: !s.collapsed, collapsed: s.collapsed,
      isDrop: s.view === 'drop', isConfirm: s.view === 'confirm', isSettings: s.view === 'settings',
      status: s.status, shortcut: s.settings.shortcut,
      trayBg: s.collapsed ? 'transparent' : 'rgba(255,255,255,0.16)',
      toggleTray: () => this.ok() && this.setState({ collapsed: !s.collapsed }),
      expand: () => this.setState({ collapsed: false }),
      collapse: () => this.ok() && this.setState({ collapsed: true }),
      onRootDragEnter: () => { if (s.collapsed || (s.view === 'confirm' && s.seen)) this.setState({ collapsed: false, view: 'drop', status: 'idle' }); },
      onItems: items => this.ok(1) && this.save(items),
      onStatus: st => this.setState({ status: st }),
      openWeb: () => this.ok(2) && (s.tour === 2 ? this.go(3, 'SPACELOG_Prototype.dc.html') : (window.location.href = 'SPACELOG_Prototype.dc.html')),
      openSettings: () => this.ok() && this.setState({ view: 'settings' }),
      backFromSettings: () => this.setState({ view: 'drop' }),
      settings: s.settings, changeSettings: patch => this.setState(st => ({ settings: { ...st.settings, ...patch }, notice: patch.redisc === false ? false : st.notice })),
      items: s.items, planet: s.planet, autoClose: this.props.frozen || s.seen ? 0 : 6,
      changePlanet: id => { if (!this.ok(2)) return; S.patchInbox(s.ids, { planet: id }); this.setState({ planet: id }); this.keep(s.items, s.ids, id); },
      saveMemo: m => S.patchInbox(s.ids, { memo: m }),
      cancelSave: () => { if (!this.ok()) return; const n = s.ids.length; S.removeInbox(s.ids); this.keep(null); this.setState({ view: 'drop', status: 'idle', items: [], ids: [] }); this.flash(n > 1 ? n + '개 넣기를 취소했어요' : '넣기를 취소했어요. 저장하지 않았어요'); },
      // 닫아도 넣은 기록은 그대로 두고 창만 접습니다. 다시 펼치면 같은 확인 화면이 보입니다.
      closeConfirm: () => this.setState({ collapsed: true, seen: true }),
      showNewDrop: s.view === 'confirm' && !!s.seen && !s.tour, newDrop: () => { this.keep(null); this.setState({ view: 'drop', status: 'idle', items: [], ids: [], seen: false }); },
      ...Object.fromEntries(SAMPLES.map((it, n) => ['s' + n, {
        onDragStart: e => { if (!this.ok(1)) { e.preventDefault(); return; } e.dataTransfer.setData('application/x-spacelog', JSON.stringify(it)); e.dataTransfer.effectAllowed = 'copy'; },
        onClick: () => this.flash('끌어서 오른쪽 수집 앱에 놓아 보세요') }])),
      previewNotice: () => !this.ok(10) ? null : s.settings.redisc ? (re ? this.setState({ notice: true }) : this.flash('7일 전에 넣은 기록이 없어요')) : this.flash('설정에서 재발견 알림이 꺼져 있어요'),
      showNotice: s.notice && !!re && !!rp, noticeTitle: re ? re.title : '', noticePlanet: rp ? rp.name : '',
      openNotice: () => !this.ok(10) ? null : s.tour === 10 ? this.go(11, 'SPACELOG_Prototype.dc.html#redisc') : (window.location.href = 'SPACELOG_Prototype.dc.html#redisc'),
      ...(() => { const T = window.SPACELOG_TOUR, v = T ? T.view(s.tour, 'c') : { on: false, h: 0 }; return { tourOn: v.on, tourH: v.h, tourNo: v.no, tourPct: v.pct, tourTitle: v.title, tourDesc: v.desc, tourCta: v.cta, tourSkipLabel: v.skip, tourHere: v.here }; })(),
      navGuard: e => { if (s.tour) { e.preventDefault(); this.flash('체험 중에는 안내된 단계만 할 수 있어요'); } },
      dlApp: () => this.flash('프로토타입이라 실제 설치 파일은 아직 없어요'),
      tourSkip: () => this.setTour(0),
      ...(() => { const on = !!s.tour; return { tourIsOn: on, tourSwBg: on ? 'var(--color-primary)' : 'rgba(255,255,255,0.24)', tourSwLeft: on ? '18px' : '2px', tourSwText: on ? 'On' : 'Off', tourSwColor: on ? '#fff' : 'var(--color-body-muted)' }; })(),
      tourCanBack: s.tour > 1,
      tourBack: () => { const T = window.SPACELOG_TOUR, n = s.tour - 1; if (!T || n < 1) return; const pg = T.steps[n - 1].page; T.set(n);
        if (pg === 'c') { if (location.hash === '#tour') location.reload(); else { location.hash = 'tour'; location.reload(); } }
        else window.location.href = T.url(pg === 'w' ? 'SPACELOG_Prototype.dc.html' : 'SPACELOG_Collector.dc.html'); },
      tourToggle: () => { if (s.tour) this.setTour(0); else this._tourStart && this._tourStart(); },
      tourStart: this._tourStart = () => { clearTimeout(this._a); clearTimeout(this._b); this.setState(this.sceneState('open')); this.setTour(1); },
      tourNext: () => {
        const t = s.tour;
        if (t === 1) this.save([SAMPLES[2]]);
        else if (t === 2) this.go(3, 'SPACELOG_Prototype.dc.html');
        else if (t === 10) this.go(11, 'SPACELOG_Prototype.dc.html#redisc');
        else this.go(t, t === 11 ? 'SPACELOG_Prototype.dc.html#redisc' : 'SPACELOG_Prototype.dc.html');
      },
      ...Object.fromEntries([['toolDrive', 'Google Drive'], ['toolNotion', 'Notion'], ['toolSlack', 'Slack'], ['toolGmail', 'Gmail'], ['toolFigma', 'Figma']].map(([k, name]) => [k, () => this.ok() && this.flash(name + ' 연결은 준비 중이에요')])),
      addTool: () => this.ok() && this.flash('연결할 수 있는 도구를 더 준비하고 있어요'),
      flash: m => this.flash(m),
      toast: s.toast, toastOpacity: s.toastOn ? 1 : 0
    };
  }
}
</script>
